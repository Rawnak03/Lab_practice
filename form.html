<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
    }

    form {
        width: 400px;
        margin: 40px auto;
        padding: 25px;
        background-color: white;
        border-radius: 10px;
    }

    input, select, textarea {
        margin-top: 5px;
        margin-bottom: 12px;
        padding: 6px;
    }

    input[type="submit"],
    input[type="reset"] {
        padding: 8px 15px;
        cursor: pointer;
    }
</style>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
    }

    form {
        width: 400px;
        margin: 40px auto;
        padding: 25px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
    }

    input, select, textarea {
        margin-top: 5px;
        margin-bottom: 10px;
        padding: 7px;
    }

    input[type="submit"] {
        background-color: green;
        color: white;
        border: none;
        padding: 8px 15px;
    }

    input[type="reset"] {
        background-color: red;
        color: white;
        border: none;
        padding: 8px 15px;
    }
</style>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 20px;
    }

    h2 {
        text-align: center;
        color: #333;
    }

    form {
        width: 400px;
        margin: 30px auto;
        padding: 25px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        margin-bottom: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: blue;
        outline: none;
    }

    textarea {
        resize: none;
    }

    input[type="radio"] {
        margin: 5px;
    }

    input[type="submit"],
    input[type="reset"] {
        padding: 9px 18px;
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
    }

    input[type="submit"] {
        background-color: green;
    }

    input[type="reset"] {
        background-color: red;
    }

    input[type="submit"]:hover {
        background-color: darkgreen;
    }

    input[type="reset"]:hover {
        background-color: darkred;
    }
</style>
</head>
<body>

<form action="" method="post" enctype="multipart/form-data">

    Name:<br>
    <input type="text" name="firstname" value="Mr A"
           placeholder="Your Name" required>
    <br>

    <input type="hidden" name="lastname" value="hghf">
    <br>

    Email:<br>
    <input type="email" name="email" required>
    <br>

    Mobile:<br>
    <input type="number" name="mobile">
    <br>

    DOB:<br>
    <input type="date" name="dob">
    <br>

    Password:<br>
    <input type="password" name="password">
    <br>

    Gender:<br>
    <input type="radio" name="gender" checked>Male
    <input type="radio" name="gender">Female
    <br>

    Courses:<br>
    <input type="checkbox" name="c[]"> CSE 3209
    <input type="checkbox" name="c[]"> CSE 3210
    <br>

    District:<br>
    <select name="dist">
        <option>Select district</option>
        <option value="raj">Rajshahi</option>
        <option value="dha">Dhaka</option>
    </select>
    <br><br>

    <textarea name="address" rows="5" cols="30"></textarea>
    <br>

    <input type="file" name="file">
    <br>

    <input type="reset" name="" value="Clear">
    <input type="submit" name="sub" value="Add">

</form>

</body>
<body>

        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <input type="date" name="dob">

        Course:
        <select name="course">
            <option>Select Course</option>

            <option>EEE</option>
            <option>BBA</option>
        </select>
        <br><br>

        Address:
        <br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">

    </form>

    <h2>Student Registration Form</h2>

<p>Please fill up the form below</p>

<form>
    Name:
    <input type="text" name="name">

    Email:
    <input type="email" name="email">

    <input type="submit" value="Submit">
</form>

</body>
</html>
